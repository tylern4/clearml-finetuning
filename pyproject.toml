[project]
name = "clearml-finetuning"
version = "0.1.0"
description = "Distill + fine-tune a coder model for agent use, tracked with ClearML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
clearml = [
    "clearml>=2.1",
    "boto3>=1.28",
    "matplotlib>=3.8",
]
distill = [
    "vllm>=0.11.0",
    "transformers>=4.57",
]
train = [
    "torch>=2.9.0",
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate>=1.10",
]
eval = [
    "vllm>=0.11.0",
    "transformers>=4.57",
    "peft>=0.17",
    "datasets>=3.0",
]
